<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Администрирование</title><link rel="stylesheet" href="admin.css"></head><body><main class="wrap"><section id="auth" class="panel"><div class="eyebrow">ЗАКРЫТЫЙ РАЗДЕЛ</div><h1>Администрирование</h1><p class="muted">Почта подтверждается ссылкой из письма. Пароль придумываете самостоятельно.</p><div class="tabs"><button id="loginTab" class="active">Войти</button><button id="registerTab">Регистрация</button></div><form id="loginForm"><label>Почта<input id="loginEmail" type="email" autocomplete="email" required></label><label>Пароль<div class="password"><input id="loginPassword" type="password" autocomplete="current-password" required><button type="button" class="eye" data-eye="loginPassword">◉</button></div></label><button class="primary">Войти</button><button type="button" class="link" id="forgot">Забыли пароль?</button></form><form id="registerForm" hidden><label>Почта<input id="registerEmail" type="email" autocomplete="email" required></label><label>Придумайте пароль<div class="password"><input id="registerPassword" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="eye" data-eye="registerPassword">◉</button></div></label><label>Повторите пароль<input id="registerPassword2" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary">Создать аккаунт</button></form><form id="resetForm" hidden><label>Почта<input id="resetEmail" type="email" autocomplete="email" required></label><button class="primary">Отправить письмо для сброса</button><button type="button" class="link" id="backLogin">Назад</button></form><form id="newPasswordForm" hidden><p class="muted">Введите новый пароль.</p><label>Новый пароль<div class="password"><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required><button type="button" class="eye" data-eye="newPassword">◉</button></div></label><button class="primary">Сохранить новый пароль</button></form><p id="message" class="message"></p></section><section id="dashboard" class="panel" hidden><div class="topline"><div><div class="eyebrow">ПАНЕЛЬ</div><h1>Библиотека</h1></div><button id="logout" class="secondary">Выйти</button></div><p class="muted">Только PDF. Максимальный размер файла — 200 МБ.</p><form id="bookForm" class="upload"><label>Название книги<input id="title" required maxlength="200"></label><label>Автор<input id="author" maxlength="200"></label><label>PDF-файл<input id="pdf" type="file" accept="application/pdf,.pdf" required></label><button class="primary">Загрузить PDF</button><p id="uploadMessage" class="message"></p></form><div id="books" class="books"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
