<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — NOXCHIY</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f4f4f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:32px 18px 60px}.card{background:#151515;border:1px solid #292929;border-radius:18px;padding:22px;margin-top:18px}
    h1{margin:0 0 8px;font-size:28px}.muted{color:#999}.hidden{display:none}label{display:block;margin:15px 0 7px;color:#bbb;font-size:14px}
    input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #333;background:#0f0f0f;color:#fff;font-size:16px}
    button{border:0;border-radius:10px;padding:12px 16px;background:#fff;color:#111;font-weight:700;font-size:15px;cursor:pointer;margin-top:16px}
    button.secondary{background:#252525;color:#fff}button.danger{background:#7d2525;color:#fff;margin-top:0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
    .book{padding:15px 0;border-bottom:1px solid #292929}.book:last-child{border-bottom:0}.book-title{font-weight:700}.book-author{color:#999;font-size:14px;margin-top:4px}
    .book-actions{display:flex;gap:8px;margin-top:10px}.book-actions a{color:#fff;text-decoration:none;font-size:14px}
    .status{margin-top:12px;color:#aaa;font-size:14px}.error{color:#ff7777}.ok{color:#75d39a}
  </style>
</head>
<body>
<div class="wrap">
  <div id="loginCard" class="card">
    <p class="muted">NOXCHIY · ADMIN</p>
    <h1>Панель администратора</h1>
    <p class="muted">Закрытый доступ.</p>
    <form id="loginForm">
      <label>Логин</label><input id="username" autocomplete="username" required>
      <label>Пароль</label><input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Войти</button>
      <div id="loginStatus" class="status"></div>
    </form>
  </div>

  <div id="adminCard" class="hidden">
    <div class="row">
      <div><p class="muted">NOXCHIY · ADMIN</p><h1>Управление сайтом</h1></div>
      <button id="logout" class="secondary">Выйти</button>
    </div>

    <div class="card">
      <h2>Добавить книгу</h2>
      <form id="uploadForm">
        <label>Название книги</label><input id="title" required maxlength="180">
        <label>Автор</label><input id="author" maxlength="120">
        <label>PDF-файл</label><input id="file" type="file" accept="application/pdf,.pdf" required>
        <button type="submit">Опубликовать книгу</button>
        <div id="uploadStatus" class="status"></div>
      </form>
    </div>

    <div class="card">
      <div class="row"><h2>Опубликованные книги</h2><button id="refresh" class="secondary">Обновить</button></div>
      <div id="books"><p class="muted">Загрузка…</p></div>
    </div>
  </div>
</div>

<script type="module">
import { upload } from 'https://esm.sh/@vercel/blob@2.4.0/client';

const loginCard=document.querySelector('#loginCard'), adminCard=document.querySelector('#adminCard');
const loginStatus=document.querySelector('#loginStatus'), uploadStatus=document.querySelector('#uploadStatus');
const booksEl=document.querySelector('#books');

async function api(url, options={}) {
  const r=await fetch(url,{credentials:'same-origin',...options});
  let data={}; try{data=await r.json()}catch{}
  if(!r.ok) throw new Error(data.error||'Ошибка запроса');
  return data;
}
function showAdmin(){loginCard.classList.add('hidden');adminCard.classList.remove('hidden');loadBooks()}
async function check(){try{await api('/api/books');}catch{}}
document.querySelector('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();loginStatus.className='status';loginStatus.textContent='Вход…';
  try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});showAdmin()}
  catch(err){loginStatus.className='status error';loginStatus.textContent=err.message}
});
document.querySelector('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};
document.querySelector('#refresh').onclick=loadBooks;

async function loadBooks(){
  booksEl.innerHTML='<p class="muted">Загрузка…</p>';
  try{
    const data=await api('/api/books');
    if(!data.books.length){booksEl.innerHTML='<p class="muted">Книг пока нет.</p>';return}
    booksEl.innerHTML=data.books.map(b=>'<div class="book"><div class="book-title">'+esc(b.title)+'</div><div class="book-author">'+esc(b.author||'Автор не указан')+'</div><div class="book-actions"><a href="'+esc(b.url)+'" target="_blank">Открыть</a><button class="danger" data-url="'+esc(b.url)+'">Удалить</button></div></div>').join('');
    booksEl.querySelectorAll('.danger').forEach(btn=>btn.onclick=async()=>{if(!confirm('Удалить эту книгу?'))return;try{await api('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:btn.dataset.url})});loadBooks()}catch(err){alert(err.message)}});
  }catch(err){booksEl.innerHTML='<p class="error">'+esc(err.message)+'</p>'}
}
document.querySelector('#uploadForm').addEventListener('submit',async e=>{
  e.preventDefault();const file=document.querySelector('#file').files[0];
  uploadStatus.className='status';uploadStatus.textContent='Загрузка…';
  try{
    if(!file||file.type!=='application/pdf')throw new Error('Выберите PDF-файл.');
    const meta={title:document.querySelector('#title').value.trim(),author:document.querySelector('#author').value.trim()};
    await upload(file.name,{body:file,access:'public',handleUploadUrl:'/api/upload',clientPayload:JSON.stringify(meta)});
    uploadStatus.className='status ok';uploadStatus.textContent='Книга опубликована.';
    e.target.reset();loadBooks();
  }catch(err){uploadStatus.className='status error';uploadStatus.textContent=err.message}
});
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
check();
</script>
</body>
</html>
